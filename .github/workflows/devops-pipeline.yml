name: Enterprise DevOps Pipeline

# Operational Trigger Events: Watch the repository for push and PR events on the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  operational-validation:
    name: Operational Verification Loop
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out your source file tree properties onto the automated runner container
    - name: Clone Source Code Repository
      uses: actions/checkout@v4

    # Step 2: Initialize the official Microsoft .NET SDK compilation engine environment
    - name: Initialize .NET 10 Framework SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Step 3: Clear old caches and restore third-party NuGet engine packages automatically
    - name: Automated Package Restore Sequence
      run: dotnet restore

    # Step 4: Run compilation verification loops to intercept typos, syntax errors, and bracket breaks
    - name: Execute Compilation Code Quality Gate
      run: dotnet build --configuration Release --no-restore

    # Step 5: Run a local publication build check to simulate enterprise release readiness
    - name: Validate Production Deployment Checklist
      run: dotnet publish --configuration Release --output ./publish_output --no-restore
